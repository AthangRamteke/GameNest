<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four · GameNest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23141311%27/%3E%3Cpath d=%27M9 9l14 14M23 9L9 23%27 stroke=%27%238cc9ab%27 stroke-width=%273.5%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/shared.css">
<style>
.red{--c:var(--x)} .yel{--c:var(--gold)}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;width:min(100%,480px);margin:0 auto;
  background:var(--surface);border:1.5px solid var(--line);border-radius:18px}
.col{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:transparent;border-radius:12px;cursor:pointer;transition:background .15s}
.col:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
.col:disabled{cursor:default}
.slot{aspect-ratio:1;border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 5px #0006;position:relative}
.disc{position:absolute;inset:7%;border-radius:50%;animation:drop .38s cubic-bezier(.5,0,.9,.6) backwards}
.disc.p1{background:var(--x)} .disc.p2{background:var(--gold)}
.disc.win{box-shadow:0 0 0 3px var(--ink)}
.disc.last::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#0003}
@keyframes drop{from{transform:translateY(calc(var(--r) * -112% - 130%))}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <nav class="crumb"><a class="brand" href="../../index.html">GameNest</a><span class="sep">/</span><span class="here">Connect Four</span></nav>
    <button class="icon-btn" id="mute" aria-label="Sound on" aria-pressed="false">
      <svg viewBox="0 0 24 24" class="snd-on"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg viewBox="0 0 24 24" class="snd-off"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </header>

  <main class="view">
    <div class="toolbar">
      <div class="field"><span class="lbl">Opponent</span><div class="seg" id="segMode"></div></div>
      <div class="field" id="fDiff"><span class="lbl">Difficulty</span><div class="seg" id="segDiff"></div></div>
    </div>

    <div class="stats">
      <div class="stat red" id="s1"><span class="who" id="n1"></span><span class="num" id="c1">0</span></div>
      <div class="stat mid"><span class="who">Draws</span><span class="num" id="cd">0</span></div>
      <div class="stat yel r" id="s2"><span class="who" id="n2"></span><span class="num" id="c2">0</span></div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
    <div class="board" id="board" role="group" aria-label="Connect Four board"></div>

    <div class="actions">
      <button class="btn" id="undo">Undo</button>
      <button class="btn primary" id="again">New game</button>
    </div>
  </main>
  <footer class="foot">Connect four discs in a row, column or diagonal · Computer uses depth-limited minimax</footer>
</div>
<script src="../../assets/shared.js"></script>
<script src="game.js"></script>
</body>
</html>
