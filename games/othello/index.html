<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Othello · GameNest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23141311%27/%3E%3Cpath d=%27M9 9l14 14M23 9L9 23%27 stroke=%27%238cc9ab%27 stroke-width=%273.5%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/shared.css">
<style>
.blk{--c:var(--o)} .wht{--c:var(--ink)}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:8px;width:min(100%,480px);margin:0 auto;
  background:var(--line);border-radius:16px}
.sq{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:6px;background:var(--surface);cursor:default}
.sq.ok{cursor:pointer}
.sq.ok:hover{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.sq.ok::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--accent);opacity:.55}
.sq.last{box-shadow:inset 0 0 0 2px var(--accent)}
.stone{position:absolute;inset:9%;border-radius:50%;transition:transform .3s,background .3s;box-shadow:0 2px 4px #0005}
.stone.b{background:#0b0d12;box-shadow:0 0 0 1.5px #4a5164,0 2px 4px #0005}
.stone.w{background:#f1f3f8}
.stone.pop{animation:pop .25s ease-out}
.stone.flip{animation:flip .35s ease}
@keyframes pop{from{transform:scale(.2)}}
@keyframes flip{50%{transform:scaleX(.05)}}
.record{text-align:center;color:var(--muted);font-size:.85rem;margin-top:14px;min-height:1.3em}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <nav class="crumb"><a class="brand" href="../../index.html">GameNest</a><span class="sep">/</span><span class="here">Othello</span></nav>
    <button class="icon-btn" id="mute" aria-label="Sound on" aria-pressed="false">
      <svg viewBox="0 0 24 24" class="snd-on"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg viewBox="0 0 24 24" class="snd-off"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </header>

  <main class="view">
    <div class="toolbar">
      <div class="field"><span class="lbl">Opponent</span><div class="seg" id="segMode"></div></div>
      <div class="field" id="fDiff"><span class="lbl">Difficulty</span><div class="seg" id="segDiff"></div></div>
    </div>

    <div class="stats">
      <div class="stat blk" id="sB"><span class="who" id="nB"></span><span class="num" id="cB">2</span></div>
      <div class="stat mid"><span class="who">Empty</span><span class="num" id="cE">60</span></div>
      <div class="stat wht r" id="sW"><span class="who" id="nW"></span><span class="num" id="cW">2</span></div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
    <div class="board" id="board" role="grid"></div>
    <p class="record" id="record"></p>

    <div class="actions">
      <button class="btn" id="undo">Undo</button>
      <button class="btn primary" id="again">New game</button>
    </div>
  </main>
  <footer class="foot">Trap the opponent's discs between two of yours to flip them · Black moves first · Green dots show legal moves</footer>
</div>
<script src="../../assets/shared.js"></script>
<script src="game.js"></script>
</body>
</html>
